 RDT_EAST_SHOWDOWN_2022_01_01_DESC: "PMC 'Redut' is one of the oldest private military companies, originating back in 2003. It is worth noting that at the dawn of the 2000s, the interests of Russian companies were protected by poorly organized PMSCs. The disorganization was ended by the GRU, which undoubtedly participated in creating a unified company for protecting private interests. The initiator of the PMC was the First Deputy Chief of the GRU of the General Staff of the Russian Armed Forces: Vladimir Alekseev. It can be said that he subsequently 'occupied' the place of Dmitry Utkin, while the 'Prigozhin' role was played by Anatoly Karaziy, who managed the external economic and political course of the PMC. Having traversed a path from Yugoslavia to Syria, the PMC took part in the SMO to help its fatherland in the fight against neo-Nazism."
 RDT_EAST_SHOWDOWN_2022_04_15_DESC: "'Redut' shifted its operational profile from far abroad to its nearest neighbor — Ukraine. Routine support for disorganized PMSCs was replaced by direct participation in the special military operation under the banners of the GRU. By the spring of 2022, units of the Ministry of Defense of the Russian Federation began using the personnel rotation system established by 'Vladimir Alekseev's company'. However, it is worth noting that this structure was in a state of limbo. Coordination between 'Redut' units and the Russian MoD was very weak, significantly increasing the risk of friendly fire and inflicting irreparable losses on this PMC in the first stage. The structure and objectives of 'Redut' are unknown. From the shadows emerges a completely different PMC — 'Wagner'. This highly specialized company was redeployed to Popasna, where by a sudden strike it liberated the settlement of Novooleksandrivka and advanced to the outskirts of Popasna itself. Although the fate of the 'Wagner' offensive remains unknown, one thing is invariable: the fate of PMC 'Redut' directly depends on the success of its potential competitor."
 RDT_EAST_SHOWDOWN_2022_09_06_DESC: "By the beginning of September 2022, the 'internal showdown' of private armies had finally entered a decisive stage. While 'Redut' was trying to restore coordination with Russian MoD units and replenish critical losses, its competitor in the form of PMC 'Wagner' was rapidly picking up pace. After the liberation of Popasna and the breakthrough of fortified areas at the Pokrovske — Kodema line, the 'musicians' came close to Artemivsk, starting battles for the eastern outskirts of the city. Vladimir Alekseev's brainchild, which until recently had laid claim to the role of the GRU's main strike force, was by this point pushed into secondary roles. The rotation system introduced by 'Alekseev's company' had effectively stopped working, and its functions began to flow to the more successful structure. The fate of 'Redut', which directly depended on the competitor's successes, was sealed: in the fierce battle for Donbass, the 'orchestra' had gained the upper hand, and it was precisely it that was destined to lead the next arc of the Russian-Ukrainian conflict."